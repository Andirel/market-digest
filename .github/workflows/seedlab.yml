name: Seedlab weekly research

on:
  push:
    paths:
      - 'seedlab/**'
      - '.github/workflows/seedlab.yml'
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seedlab-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize and verify application source
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          root=Path('seedlab')
          if not (root/'index.html').exists():
              payload=''.join((root/f'bootstrap-{i}.b64').read_text().strip() for i in range(1,5))
              raw=lzma.decompress(base64.b64decode(payload,validate=True))
              assert hashlib.sha256(raw).hexdigest()=='5c8100b638829abfdbaa603c882a627038895721cdad70bc1e79d060f6985709','Bundle checksum mismatch'
              files=json.loads(raw)
              allowed={'universe.json','refresh.py','index.html','styles.css','engine.js','app.js','test_engine.js','test_refresh.py','README.md'}
              assert set(files)==allowed
              for name,content in files.items():
                  (root/name).write_text(content,encoding='utf-8')
          PY
      - name: Restore prior dated market snapshot
        run: |
          git fetch origin gh-pages --depth=1
          git show origin/gh-pages:seedlab/data.json > seedlab/prior.json 2>/dev/null || true
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('seedlab')
          try:
              old=json.loads((root/'prior.json').read_text())
              assert old.get('assets')
          except Exception:
              old=json.loads((root/'universe.json').read_text())
              old['coverage']={'total':32,'fresh':0,'stale':0,'unavailable':32}
              for a in old['assets']+old['core']: a['status']='unavailable'
          text=json.dumps(old,allow_nan=False,separators=(',',':'))
          (root/'data.json').write_text(text)
          (root/'data.js').write_text('window.SEED_DATA='+text+';')
          (root/'prior.json').unlink(missing_ok=True)
          PY
      - name: Install market-data dependencies
        run: pip install yfinance pandas numpy
      - name: Test allocation constraints and indicators
        run: |
          node seedlab/test_engine.js
          cd seedlab && python -m unittest test_refresh.py
      - name: Refresh market data without fabricating missing fields
        id: market
        continue-on-error: true
        env:
          REUSE_RECENT: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python seedlab/refresh.py
      - name: Save readable source and remove transport bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seedlab/index.html seedlab/styles.css seedlab/engine.js seedlab/app.js seedlab/refresh.py seedlab/universe.json seedlab/test_engine.js seedlab/test_refresh.py seedlab/README.md
          git rm -f --ignore-unmatch seedlab/bootstrap-1.b64 seedlab/bootstrap-2.b64 seedlab/bootstrap-3.b64 seedlab/bootstrap-4.b64
          if ! git diff --cached --quiet; then
            git commit -m 'Store readable Seedlab application source [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare public dashboard only
        run: |
          mkdir -p site
          cp seedlab/index.html seedlab/styles.css seedlab/engine.js seedlab/app.js seedlab/data.json seedlab/data.js site/
          touch site/.nojekyll
      - name: Publish Seedlab while retaining the root market dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: seedlab
          keep_files: true
      - name: Report snapshot coverage
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('seedlab/data.json')
          if p.exists():
              d=json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('# Seedlab market coverage\n\n'+json.dumps(d.get('coverage',{}))+'\n\nCollected: '+str(d.get('generatedAt','not yet collected'))+'\n')
          PY
      - name: Surface total market-provider failure
        if: steps.market.outcome == 'failure'
        run: |
          echo 'Market refresh failed. Public page retains dated data or visible unavailable states; no fresh data is claimed.'
          exit 1

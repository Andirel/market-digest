name: daily-digest

on:
  schedule:
    # 09:30 UTC every weekday (after US analyst data settles). Cron is UTC.
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the dashboard data + assets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCHLIST: "AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA"
          TOP_N: "500"
          ENRICH_SLEEP: "0.35"
        run: python main.py
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          # Keep independently maintained sub-sites, including seedlab/.
          keep_files: true

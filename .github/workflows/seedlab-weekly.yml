name: seedlab-weekly
on:
  push:
    branches: [main]
    paths: ['seedlab/**', '.github/workflows/seedlab-weekly.yml']
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: seedlab-publish
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check dashboard JavaScript syntax
        run: node --check seedlab/app.js
      - name: Install public-market research dependencies
        run: pip install 'yfinance>=0.2.65,<2' 'pandas>=2.2,<3' 'numpy>=2,<3'
      - name: Calculate and validate snapshot
        id: refresh
        continue-on-error: true
        run: python seedlab/build.py
      - name: Prepare website without changing existing dashboard
        if: always()
        run: |
          mkdir -p publish/seedlab
          for f in index.html styles.css app.js data.json data.js; do
            if [ -f seedlab/$f ]; then cp seedlab/$f publish/seedlab/; fi
          done
          if [ -d seedlab/history ]; then cp -r seedlab/history publish/seedlab/; fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('publish/seedlab/data.json')
          if p.exists():
              d=json.loads(p.read_text())
              fields=['ticker','price','asOf','status','rsi','momentum','low52','high52','ratings']
              s={k:d.get(k) for k in ['generatedAt','coverage','schedule','researchAsOf']}
              s['assets']=[{k:r.get(k) for k in fields} for r in d.get('assets',[])+d.get('core',[])]
              Path('publish/seedlab/status.json').write_text(json.dumps(s,indent=2))
          PY
      - name: Preserve downloadable research build for QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seedlab-site
          path: publish/seedlab/
          retention-days: 30
      - name: Publish Seedlab; preserve existing pages and snapshots
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          keep_files: true
      - name: Make data failure visible in Actions
        if: steps.refresh.outcome == 'failure'
        run: exit 1
